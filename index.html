<!DOCTYPE html>
<html>
<head>
    <title>Sleep & Mental Health Study</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            background: #f2f2f7;
        }

        h1, h2 { text-align: center; }

        form {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        input {
            margin: 6px 0;
            padding: 8px;
            width: 100%;
        }

        button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            background: black;
            color: white;
            border: none;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        canvas {
            background: white;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
        }

        .deleteBtn {
            background: red;
            color: white;
            border: none;
            padding: 4px;
        }
    </style>
</head>

<body>

<h1>Sleep & Mental Health Study</h1>

<form id="dataForm">
    <input type="date" id="date" required>
    <input type="time" id="bedtime" required>
    <input type="time" id="waketime" required>
    <input type="number" id="yogatime" placeholder="Yoga (min)">
    <input type="number" id="mood" placeholder="Mood (1-10)">
    <input type="number" id="anxiety" placeholder="Anxiety (1-10)">
    <input type="number" id="energy" placeholder="Energy (1-10)">
    <input type="number" id="focus" placeholder="Focus (1-10)">
    <button type="submit">Add Entry</button>
</form>

<table id="dataTable">
<thead>
<tr>
<th>Date</th><th>Sleep</th><th>Mood</th><th>Anxiety</th><th>Energy</th><th>Focus</th><th>Delete</th>
</tr>
</thead>
<tbody></tbody>
</table>

<h2>Sleep</h2>
<canvas id="sleepChart"></canvas>
<button onclick="downloadChart('sleepChart', 'sleep.png')">Download</button>

<h2>Mood</h2>
<canvas id="moodChart"></canvas>
<button onclick="downloadChart('moodChart', 'mood.png')">Download</button>

<h2>Energy</h2>
<canvas id="energyChart"></canvas>
<button onclick="downloadChart('energyChart', 'energy.png')">Download</button>

<h2>Anxiety</h2>
<canvas id="anxietyChart"></canvas>
<button onclick="downloadChart('anxietyChart', 'anxiety.png')">Download</button>

<h2>Focus</h2>
<canvas id="focusChart"></canvas>
<button onclick="downloadChart('focusChart', 'focus.png')">Download</button>

<script>
let data = JSON.parse(localStorage.getItem("studyData")) || [];

function save() {
    localStorage.setItem("studyData", JSON.stringify(data));
}

function calcSleep(bed, wake) {
    let b = new Date("1970-01-01T" + bed);
    let w = new Date("1970-01-01T" + wake);
    if (w <= b) w.setDate(w.getDate() + 1);
    return Number(((w - b) / 3600000).toFixed(2));
}

function render() {

    data.sort((a,b)=> new Date(a.date)-new Date(b.date));

    let table = document.querySelector("#dataTable tbody");
    table.innerHTML = "";

    data.forEach((d,i)=>{
        table.innerHTML += `
        <tr>
            <td>${d.date}</td>
            <td>${d.sleep}</td>
            <td>${d.mood || ""}</td>
            <td>${d.anxiety || ""}</td>
            <td>${d.energy || ""}</td>
            <td>${d.focus || ""}</td>
            <td><button class="deleteBtn" onclick="deleteEntry(${i})">X</button></td>
        </tr>`;
    });

    updateCharts();
}

function deleteEntry(i){
    data.splice(i,1);
    save();
    render();
}

document.getElementById("dataForm").addEventListener("submit", e=>{
    e.preventDefault();

    let entry = {
        date: date.value,
        sleep: calcSleep(bedtime.value, waketime.value),
        mood: Number(mood.value),
        anxiety: Number(anxiety.value),
        energy: Number(energy.value),
        focus: Number(focus.value)
    };

    data.push(entry);
    save();
    render();
    e.target.reset();
});

function createChart(id, maxY){
    return new Chart(document.getElementById(id), {
        type: "line",
        data: {
            labels: [],
            datasets: [
                { data: [], tension: 0.3 },
                { data: [], showLine: false, pointRadius: 6 }
            ]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, max: maxY } }
        }
    });
}

let sleepChart = new Chart(document.getElementById("sleepChart"), {
    type: "bar",
    data: { labels: [], datasets:[{ data: [] }] },
    options:{ scales:{ y:{ beginAtZero:true, max:12 } } }
});

let moodChart = createChart("moodChart",10);
let energyChart = createChart("energyChart",10);
let anxietyChart = createChart("anxietyChart",10);
let focusChart = createChart("focusChart",10);

function getFiltered(){
    return data.filter(d=> d.date >= "2026-03-02" && d.date <= "2026-03-14");
}

function getMarch1(){
    return data.find(d=> d.date==="2026-03-01");
}

function updateCharts(){

    let filtered = getFiltered();
    let march1 = getMarch1();

    let labels = filtered.map(d=>d.date);

    function update(chart,key){

        chart.data.labels = labels;
        chart.data.datasets[0].data = filtered.map(d=> Number(d[key]) || 0);

        if(march1){
            chart.data.datasets[1].data = [Number(march1[key])];
        }

        chart.update();
    }

    update(moodChart,"mood");
    update(energyChart,"energy");
    update(anxietyChart,"anxiety");
    update(focusChart,"focus");

    sleepChart.data.labels = data.map(d=>d.date);
    sleepChart.data.datasets[0].data = data.map(d=>d.sleep);
    sleepChart.update();
}

    function downloadChart(chartId, filename) {
    const canvas = document.getElementById(chartId);

    // Convert chart to image
    const image = canvas.toDataURL("image/png");

    // Create download link
    const link = document.createElement("a");
    link.href = image;
    link.download = filename;

    // Trigger download
    link.click();
}

render();
</script>

</body>
</html>
